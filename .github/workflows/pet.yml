name: YourTomo Pet

on:
  schedule:
    - cron: '23 */6 * * *' # Updates every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prsdx/github-pet@v1
        with:
          username: meetcodz
          timezone-offset-minutes: "330" # IST timezone offset (+5:30)
